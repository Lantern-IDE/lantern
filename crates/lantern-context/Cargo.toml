[package]
name = "lantern-context"
version = "0.1.0"
edition = "2021"
description = "Lantern context engine: local code indexing and context assembly for LLMs"
license = "Apache-2.0"
repository = "https://github.com/Lantern-IDE/lantern"

[lib]
name = "lantern_context"
path = "src/lib.rs"

[[bin]]
name = "lantern"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-tags = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
regex = "1"

[dev-dependencies]
tempfile = "3"
