name: Bug report / 버그 신고
description: Something doesn't work as expected / 기대대로 동작하지 않음
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / 무슨 일이 있었나요?
      description: What you did, what you expected, what happened instead. / 무엇을 했고, 무엇을 기대했고, 실제로 어떻게 됐나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 방법
      placeholder: |
        1. Open a project with ...
        2. Ask the agent to ...
  - type: input
    id: version
    attributes:
      label: Lantern version / 버전
      placeholder: "0.1.0 (Help → About)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / 운영체제
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model / provider / 모델
      placeholder: "claude-sonnet-5 / Ollama qwen2.5-coder:14b / ..."
  - type: textarea
    id: report
    attributes:
      label: Problem report (optional) / 문제 보고 내용 (선택)
      description: "Help → Report Issue… collects logs with API keys masked. Check it before pasting. / 도움말 → 문제 보고…에서 모은 로그(API 키는 가려짐)를 확인한 뒤 붙여 넣으세요."
      render: text
