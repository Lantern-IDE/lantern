# npm 게시: 손으로만 돌린다. 게시된 cli-v<버전> 릴리스를 받아 체크섬을 확인하고 패키지를 만든 뒤,
# 이 러너(linux-x64)에 실제로 설치해 돌려 보고, 플랫폼 패키지부터 올리고 lantern-ide를 맨 뒤에 올린다.
# 기본은 dry run: 게시 직전까지만 한다.
# 필요한 저장소 비밀값: NPM_TOKEN (docs/배포_가이드.md 5절)
name: npm publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI 버전 (예: 0.1.0). cli-v0.1.0 릴리스가 게시되어 있어야 한다"
        required: true
        type: string
      dry_run:
        description: "패키지 조립과 설치 확인까지만 하고 게시하지 않는다"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: npm 패키지
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 릴리스 상태 확인
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 X.Y.Z로 적습니다: $VERSION"
            exit 1
          fi
          is_draft=$(gh release view "cli-v$VERSION" --json isDraft --jq .isDraft)
          if [ "$is_draft" != false ]; then
            echo "::error::cli-v$VERSION 릴리스를 먼저 게시하세요 (초안은 사용자가 받을 수 없습니다)"
            exit 1
          fi
          # 게시 바로 뒤에 도는 단계라 여기서 마지막으로 확인한다
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          echo "지금 latest: $latest"
          case "$latest" in
            cli-*)
              echo "::error::latest가 CLI 릴리스($latest)를 가리킵니다. 앱 자동 업데이트가 깨지므로 앱 릴리스로 되돌리세요 (docs/배포_가이드.md 5절)"
              exit 1
              ;;
          esac

      - name: 릴리스 파일 받기
        run: gh release download "cli-v$VERSION" --dir release

      - name: 패키지 조립과 체크섬 확인
        run: node scripts/npm_pack.mjs release "$VERSION" --out npm-out

      - name: npm pack
        run: |
          mkdir tarballs
          for dir in npm-out/*/; do
            npm pack "./$dir" --pack-destination tarballs
          done
          ls -l tarballs

      - name: 실행 권한 확인
        run: |
          for file in tarballs/lantern-ide-darwin-*.tgz tarballs/lantern-ide-linux-*.tgz; do
            if ! tar -tvzf "$file" package/bin/lantern | grep -q '^-rwxr-xr-x'; then
              echo "::error::$file 안의 바이너리에 실행 권한이 없습니다"
              exit 1
            fi
          done

      - name: 설치해서 돌려 보기
        run: |
          mkdir smoke
          cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund "../tarballs/lantern-ide-linux-x64-$VERSION.tgz" "../tarballs/lantern-ide-$VERSION.tgz"
          # --no: 설치가 잘못됐을 때 npm의 다른 lantern 패키지를 받아 실행하지 않게
          test "$(npx --no -- lantern --version)" = "lantern $VERSION"
          bash ../scripts/cli_smoke.sh node_modules/lantern-ide-linux-x64/bin/lantern "$VERSION"

      - name: 게시 (플랫폼 패키지 먼저, lantern-ide는 맨 뒤)
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::저장소 비밀값 NPM_TOKEN이 없습니다 (docs/배포_가이드.md 5절)"
            exit 1
          fi
          npm whoami
          # 중간에 실패해 다시 돌려도 이미 올라간 패키지는 건너뛴다 (같은 버전은 다시 올릴 수 없다)
          publish() {
            local name=$1
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "이미 있음: $name@$VERSION"
            else
              npm publish "tarballs/$name-$VERSION.tgz" --access public
            fi
          }
          for file in tarballs/lantern-ide-*-"$VERSION".tgz; do
            base=$(basename "$file")
            publish "${base%-"$VERSION".tgz}"
          done
          publish lantern-ide
