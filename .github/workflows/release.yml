# 릴리스: v로 시작하는 태그를 올리면 세 운영체제 설치 파일을 만들어 초안(draft) 릴리스에 올린다.
#   Windows: NSIS 설치 파일 (.exe)
#   macOS:   .dmg (Apple Silicon + Intel 유니버설, 임시 서명. 공증 전이라 처음 열 때 허용 필요)
#   Linux:   AppImage, .deb
# 업데이트 파일 서명과 latest.json은 tauri-action이 만든다. 초안을 확인한 뒤 직접 게시한다.
# 필요한 저장소 비밀값: TAURI_SIGNING_PRIVATE_KEY (docs/배포_가이드.md 2절), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (없으면 빈 값)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: "--bundles nsis"
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: Linux
            os: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 시스템 라이브러리
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 프론트엔드 의존성
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Lantern ${{ github.ref_name }}"
          releaseBody: "릴리스 노트를 채운 뒤 게시하세요."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
