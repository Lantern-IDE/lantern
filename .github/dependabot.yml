# 의존성 업데이트: 매주 월요일, 종류별로 묶어서 PR 하나로 올린다.
# 새 의존성·메이저 업데이트는 THIRD_PARTY_NOTICES.md 갱신(python scripts/gen_notices.py)이 필요하다.
# tauri 크레이트와 @tauri-apps 패키지는 마이너가 맞아야 빌드된다. 생태계별 PR로 갈라지면 묶음 전체가 실패해
# 마이너는 받지 않고 손으로 함께 올린다. 패치는 그대로 받는다.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Seoul }
    labels: ["type: chore", "area: infra"]
    commit-message: { prefix: "CHORE" }
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor"]
    groups:
      rust-minor: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly, day: monday, timezone: Asia/Seoul }
    labels: ["type: chore", "area: infra"]
    commit-message: { prefix: "CHORE" }
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /eval/ab
    schedule: { interval: monthly, timezone: Asia/Seoul }
    labels: ["type: chore", "area: eval"]
    commit-message: { prefix: "CHORE" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Seoul }
    labels: ["type: ci"]
    commit-message: { prefix: "CHORE" }
