[package]
name = "lantern-app"
version = "0.1.0"
edition = "2021"
description = "Lantern IDE"
license = "Apache-2.0"
repository = "https://github.com/Lantern-IDE/lantern"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lantern-context = { path = "../../crates/lantern-context" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
portable-pty = "0.9"
globset = "0.4"
similar = "2"
which = "8"
dirs = "6"
ignore = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
toml_edit = "0.25"
notify = "8"
trash = "5"
tauri-plugin-updater = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
